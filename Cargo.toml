[workspace]
members  = ["crates/app"]
resolver = "2"

[workspace.package]
version     = "1.2.0"
edition     = "2021"
authors     = ["kartinul"]
license     = "MIT"
repository  = "https://github.com/kartinul/savecodex"

# --------------------------------------------------------------------------- #
# Workspace-level dependency versions
# --------------------------------------------------------------------------- #
[workspace.dependencies]

# CLI
clap   = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = { version = "1" }

# web framework
axum         = { version = "0.7", features = ["multipart"] }
tower-http   = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# async runtime
tokio        = { version = "1",  features = ["full"] }

# frontend embedding
rust-embed   = { version = "8",  features = ["axum-ex"] }

# serialisation
serde_json   = { version = "1" }

# tracing / logging
tracing             = { version = "0.1" }
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# MIME type detection
mime_guess   = { version = "2" }

# image rendering
image        = { version = "0.24", default-features = false, features = ["png"] }
ab_glyph     = "0.2"
imageproc    = { version = "0.23", default-features = false }

# pty / execution
portable-pty = { version = "0.8" }
serde        = { version = "1", features = ["derive"] }
directories  = { version = "5" }
hostname     = { version = "0.4" }

# HTTP Client and Env Vars
reqwest      = { version = "0.12", features = ["json"] }
dotenvy      = { version = "0.15" }

# Document generation and file finding
docx-rs = "0.4"

ignore = "0.4"
natord = "1.0"
tempfile = "3"
