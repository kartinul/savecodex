name: Release
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: savecodex-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: savecodex-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: savecodex-macos-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: savecodex-macos-arm64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Prepare Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/savecodex ${{ matrix.artifact_name }}
        
      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: copy target\${{ matrix.target }}\release\savecodex.exe ${{ matrix.artifact_name }}
        
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
